<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Налаштування</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body.light {
            background: linear-gradient(135deg, #fff5f7 0%, #ffebee 50%, #fce4ec 100%);
            color: #4a3e43;
        }
        body.light .container {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 182, 193, 0.4);
            box-shadow: 0 12px 40px rgba(233, 30, 99, 0.08);
        }
        body.light .info-box {
            background: #fff0f3;
            border: 1px solid #ffe0e6;
        }
        body.light select {
            background: #ffffff;
            color: #4a3e43;
            border: 1px solid #ffcdd2;
        }
        body.light .nav-bar a {
            color: #e91e63;
        }

        body.dark {
            background: linear-gradient(135deg, #181214 0%, #211518 100%);
            color: #f5e6e8;
        }
        body.dark .container {
            background: rgba(36, 24, 28, 0.9);
            border: 1px solid rgba(255, 128, 171, 0.15);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        body.dark .info-box {
            background: #2d1d22;
            border: 1px solid #3d262d;
        }
        body.dark select {
            background: #2d1f23;
            color: #fff;
            border: 1px solid #4a3339;
        }
        body.dark .nav-bar a {
            color: #ff79b0;
        }

        body {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 35px 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            height: fit-content;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            font-size: 0.9em;
        }

        .nav-bar a {
            text-decoration: none;
            font-weight: 600;
        }

        .nav-bar a:hover {
            text-decoration: underline;
        }

        h1 {
            font-size: 1.7em;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
        }

        .info-box {
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 25px;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .section-title {
            font-size: 0.92em;
            font-weight: 600;
            margin-bottom: 10px;
            opacity: 0.85;
        }

        .action-group {
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(128, 128, 128, 0.15);
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        select {
            flex: 1;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.95em;
            outline: none;
        }

        select:focus {
            border-color: #e91e63 !important;
            box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.15);
        }

        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9em;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%);
            color: white;
            width: auto;
            box-shadow: 0 4px 12px rgba(233, 30, 99, 0.25);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 16px rgba(233, 30, 99, 0.35);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff5252 0%, #d32f2f 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.2);
        }
        .btn-danger:hover {
            box-shadow: 0 6px 16px rgba(211, 47, 47, 0.3);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffa726 0%, #f57c00 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(245, 124, 0, 0.2);
        }
        .btn-warning:hover {
            box-shadow: 0 6px 16px rgba(245, 124, 0, 0.3);
        }
    </style>
</head>
<body class="{{ theme }}">
    <div class="container">
        <div class="nav-bar">
            <a href="{% url 'home' %}">← Профіль</a>
            <a href="{% url 'tasks' %}">Мої справи →</a>
        </div>

        <h1>⚙️ Налаштування</h1>
        <div class="info-box">
            <p><strong>Поточне ім'я:</strong> {{ username }}</p>
            <p><strong>Поточна тема:</strong> {% if theme == 'dark' %}Темна{% else %}Світла{% endif %}</p>
        </div>
        <div class="action-group">
            <div class="section-title">Змінити тему оформлення</div>
            <form method="POST" class="form-row">
                {% csrf_token %}
                <input type="hidden" name="action" value="change_theme">
                <select name="theme">
                    <option value="light" {% if theme == "light" %}selected{% endif %}>Світла</option>
                    <option value="dark" {% if theme == "dark" %}selected{% endif %}>Темна</option>
                </select>
                <button type="submit" class="btn btn-primary">Застосувати</button>
            </form>
        </div>
        <div class="action-group">
            <div class="section-title">Керування сесією імені</div>
            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="action" value="clear_name">
                <button type="submit" class="btn btn-danger">Видалити ім'я із сесії</button>
            </form>
        </div>
        <div class="action-group">
            <div class="section-title">Керування списком справ</div>
            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="action" value="clear_tasks">
                <button type="submit" class="btn btn-warning">Очистити всі справи</button>
            </form>
        </div>
        <div class="action-group" style="border-bottom: none; margin-bottom: 0;">
            <div class="section-title">Керування Cookie</div>
            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="action" value="delete_cookie">
                <button type="submit" class="btn btn-danger">Видалити куки останнього візиту</button>
            </form>
        </div>
    </div>
</body>
</html>
