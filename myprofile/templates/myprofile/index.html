<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Особистий кабінет - Профіль</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body.light {
            background: linear-gradient(135deg, #fff5f7 0%, #ffebee 50%, #fce4ec 100%);
            color: #4a3e43;
        }
        body.light .container {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 182, 193, 0.4);
            box-shadow: 0 12px 40px rgba(233, 30, 99, 0.08);
        }
        body.light input, body.light select {
            background: #ffffff;
            color: #4a3e43;
            border: 1px solid #ffcdd2;
        }
        body.light .link-btn {
            color: #e91e63;
        }

        body.dark {
            background: linear-gradient(135deg, #181214 0%, #211518 100%);
            color: #f5e6e8;
        }
        body.dark .container {
            background: rgba(36, 24, 28, 0.9);
            border: 1px solid rgba(255, 128, 171, 0.15);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        body.dark input, body.dark select {
            background: #2d1f23;
            color: #fff;
            border: 1px solid #4a3339;
        }
        body.dark .link-btn {
            color: #ff79b0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 35px 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 1.7em;
            margin-bottom: 8px;
            text-align: center;
            font-weight: 700;
        }

        .cookie-info {
            font-size: 0.85em;
            opacity: 0.75;
            text-align: center;
            margin-bottom: 25px;
        }

        .nav-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 10px 14px;
            background: rgba(128, 128, 128, 0.06);
            border-radius: 12px;
        }

        .link-btn {
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9em;
        }
        .link-btn:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.88em;
            font-weight: 600;
        }

        input[type="text"], select {
            padding: 13px 16px;
            border-radius: 12px;
            font-size: 0.95em;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: #e91e63 !important;
            box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.15);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95em;
            background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%);
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.25);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.35);
        }
    </style>
</head>
<body class="{{ theme }}">
    <div class="container">
        <h1>Вітаємо, {{ username }}! 👋</h1>

        {% if last_visit %}
            <div class="cookie-info">Останній візит: {{ last_visit }}</div>
        {% else %}
            <div class="cookie-info">Це ваш перший візит!</div>
        {% endif %}

        <div class="nav-links">
            <a href="{% url 'tasks' %}" class="link-btn">Справи →</a>
            <a href="{% url 'settings' %}" class="link-btn">Налаштування ⚙️</a>
        </div>

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="action" value="save_profile">

            <div class="form-group">
                <label for="username">Введіть ім'я:</label>
                <input type="text" id="username" name="username" placeholder="Ваше ім'я" required>
            </div>

            <div class="form-group">
                <label for="theme">Виберіть тему:</label>
                <select id="theme" name="theme">
                    <option value="light" {% if theme == "light" %}selected{% endif %}>Світла</option>
                    <option value="dark" {% if theme == "dark" %}selected{% endif %}>Темна</option>
                </select>
            </div>

            <button type="submit" class="btn">Зберегти</button>
        </form>
    </div>
</body>
</html>
